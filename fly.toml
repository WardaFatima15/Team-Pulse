app = "teampulse"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/teampulse.db"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "teampulse_data"
  destination = "/data"
